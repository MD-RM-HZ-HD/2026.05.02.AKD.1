<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الاختبار الشامل والموسع</title>
    
    <!-- مكتبة Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- الخطوط من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- استدعاء ملف الستايل الخارجي -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-[color:var(--bg-main)] font-sans text-[color:var(--text-main)]">

    <!-- الهيدر العائم والذكي بدون حاوية خلفية -->
    <div id="header-wrapper" class="fixed top-0 left-0 right-0 z-[100] p-3 md:p-4 transition-transform duration-300 pointer-events-none">
        <header class="max-w-6xl mx-auto flex items-center justify-between gap-3">
            
            <!-- زر القائمة للجوال (يحتوي على الأيقونة والكلمة معاً) -->
            <div class="flex items-center gap-2 md:hidden">
                <button id="top-nav-btn" class="pointer-events-auto px-4 py-2 text-[color:var(--accent-primary)] bg-[color:var(--bg-panel-solid)] rounded-full border-2 border-[color:var(--border-color)] shadow-sm font-bold flex items-center justify-center gap-2 hover:bg-[color:var(--bg-panel-hover)] transition-all focus:outline-none">
                    <span class="text-xl leading-none">☰</span>
                    <span class="text-sm">الأقسام</span>
                </button>
            </div>

            <!-- حاوية التبويبات (للديسكتوب) -->
            <nav id="top-nav-menu" class="pointer-events-auto hidden md:flex flex-wrap justify-center items-center gap-2 flex-1 bg-[color:var(--bg-panel-solid)] p-2 rounded-full border-2 border-[color:var(--border-color)] shadow-lg backdrop-blur-md">
                <button class="pill-btn active" data-tab="mindmap">المشجرة</button>
                <button class="pill-btn" data-tab="qa">الأسئلة</button>
                <button class="pill-btn" data-tab="cards">البطاقات</button>
                <button class="pill-btn" data-tab="tf">صواب وخطأ</button>
                <button class="pill-btn" data-tab="mcq">اختياري</button>
                <button class="pill-btn" data-tab="fill">الفراغات</button>
                <button class="pill-btn" data-tab="comp">المقارنات</button>
            </nav>

            <!-- زر الإعدادات (دائري تماماً) -->
            <button id="top-settings-btn" class="pointer-events-auto w-11 h-11 md:w-12 md:h-12 text-[color:var(--accent-primary)] bg-[color:var(--bg-panel-solid)] rounded-full border-2 border-[color:var(--border-color)] shadow-sm flex items-center justify-center hover:bg-[color:var(--bg-panel-hover)] transition-all ml-auto md:ml-0 focus:outline-none shrink-0">
                <span class="text-xl md:text-2xl leading-none">⚙️</span>
            </button>

        </header>
    </div>

    <!-- الحاوية الأساسية للمحتوى -->
    <div class="max-w-6xl mx-auto pt-20 md:pt-28 pb-10 px-2 md:px-4" id="app-container" style="font-size: 20px;">
        <div id="content-area" class="glass-panel p-4 md:p-6 min-h-[70vh]"></div>
    </div>

    <!-- نافذة الإعدادات المنبثقة -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 z-[200] hidden items-center justify-center p-4 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-[color:var(--bg-panel-solid)] border-2 border-[color:var(--border-color)] rounded-2xl shadow-2xl p-5 w-full max-w-sm flex flex-col gap-4 relative transform scale-95 transition-transform duration-300" id="settings-modal-content">
            <button id="close-settings-btn" class="absolute top-3 left-4 text-xl font-black text-[color:var(--accent-danger)] hover:scale-110 transition-transform focus:outline-none">×</button>
            <h3 class="text-lg font-black text-center text-[color:var(--accent-primary)] mb-1 border-b-2 border-dashed border-[color:var(--border-color)] pb-2">الإعدادات</h3>
            
            <div>
                <label class="block text-xs font-black text-[color:var(--text-muted)] mb-2">تخصيص المظهر:</label>
                <select id="theme-select" class="w-full p-2 text-sm border-2 border-[color:var(--border-color)] rounded-lg bg-[color:var(--bg-panel)] text-[color:var(--text-main)] font-bold focus:ring-0 cursor-pointer outline-none">
                    <option value="0">الأخضر الغابي (فاتح)</option>
                    <option value="1">الأخضر الرمادي</option>
                    <option value="2">الوضع الليلي</option>
                    <option value="3">الرمادي</option>
                </select>
            </div>

            <div class="flex justify-between items-center border-t-2 border-dashed border-[color:var(--border-color)] pt-3">
                <span class="text-xs font-black text-[color:var(--text-muted)]">حجم النص:</span>
                <div class="flex gap-2">
                    <button id="btn-font-down" class="w-10 h-10 flex justify-center items-center bg-[color:var(--bg-panel)] border-2 border-[color:var(--border-color)] rounded-lg hover:bg-[color:var(--bg-panel-hover)] font-black text-sm transition-all shadow-sm focus:outline-none">-A</button>
                    <button id="btn-font-up" class="w-10 h-10 flex justify-center items-center bg-[color:var(--accent-primary)] text-[color:var(--accent-text)] border-2 border-[color:var(--accent-primary)] rounded-lg hover:opacity-90 font-black text-sm transition-all shadow-sm focus:outline-none">+A</button>
                </div>
            </div>

            <div class="border-t-2 border-dashed border-[color:var(--border-color)] pt-3">
                <button id="btn-reset" class="w-full p-3 bg-[color:var(--accent-danger)] text-white font-black text-sm rounded-lg hover:opacity-90 transition-all shadow-md flex justify-center items-center gap-2 focus:outline-none">
                    <span class="text-lg">🔄</span> مسح الاختبار
                </button>
            </div>
        </div>
    </div>

    <!-- نافذة الأقسام المنبثقة للجوال -->
    <div id="nav-modal" class="fixed inset-0 bg-black/60 z-[200] hidden items-center justify-center p-4 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-[color:var(--bg-panel-solid)] border-2 border-[color:var(--border-color)] rounded-2xl shadow-2xl p-5 w-full max-w-sm flex flex-col gap-3 relative transform scale-95 transition-transform duration-300" id="nav-modal-content">
            <button id="close-nav-btn" class="absolute top-3 left-4 text-xl font-black text-[color:var(--accent-danger)] hover:scale-110 transition-transform focus:outline-none">×</button>
            <h3 class="text-lg font-black text-center text-[color:var(--accent-primary)] mb-1 border-b-2 border-dashed border-[color:var(--border-color)] pb-2">اختر القسم</h3>
            
            <div class="flex flex-col gap-1.5">
                <button class="pill-btn active" data-tab="mindmap">المشجرة</button>
                <button class="pill-btn" data-tab="qa">الأسئلة</button>
                <button class="pill-btn" data-tab="cards">البطاقات</button>
                <button class="pill-btn" data-tab="tf">صواب وخطأ</button>
                <button class="pill-btn" data-tab="mcq">اختياري</button>
                <button class="pill-btn" data-tab="fill">الفراغات</button>
                <button class="pill-btn" data-tab="comp">المقارنات</button>
            </div>
        </div>
    </div>

    <!-- استدعاء ملفات البيانات والسكربت -->
    <script src="./data/data.Mind.Map.js"></script>
    <script src="./data/data.Lesson.Questions.js"></script>
    <script src="./data/data.Mind.Map.1.js"></script>
    <script src="./data/data.Flash.Cards.js"></script>
    <script src="./data/data.Flash.Cards.1.js"></script>
    <script src="./data/data.qz.True.False.js"></script>
    <script src="./data/data.qz.True.False.1.js"></script>
    <script src="./data/data.qz.Multiple.Choice.js"></script>
    <script src="./data/data.qz.Multiple.1.Choice.js"></script>
    <script src="./data/data.qz.Fill.Blank.js"></script>
    <script src="./data/data.qz.Fill.Blank.1.js"></script>
    <script src="./data/data.qz.Compare.js"></script>
    <script src="./data/data.qz.Compare.1.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
